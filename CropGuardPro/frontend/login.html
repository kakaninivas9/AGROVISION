<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CROP GUARD PRO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="dark-mode auth-page">
    <div class="auth-container">
        <div class="auth-card glass animate-slide-up" style="--delay: 0.1s">
            <div class="auth-header">
                <div class="logo-icon scale-lg">
                    <i class="ph-fill ph-shield-checkered"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Login to your CropGuard Pro account</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="identifier">Email or Full Name</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope"></i>
                        <input type="text" id="identifier" placeholder="Email or Full Name" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember-me">
                        <span class="checkmark"></span>
                        Remember Me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login to Dashboard</button>
                <div id="conn-status" class="auth-status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Checking connection...</span>
                </div>
            </form>
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </div>
    </div>
    
    <div id="toast-container"></div>
    <script src="script.js?v=2"></script>
</body>
</html>
